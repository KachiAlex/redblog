<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;1,500&amp;display=swap');
    .serif { font-family:'Newsreader', serif; font-style:italic; font-weight:500; }
  </style>
  <mask id="markMask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="140">
    <rect x="6" y="6" width="88" height="128" rx="12" fill="#fff"/>
    <circle cx="17" cy="27" r="4.5" fill="#000"/>
    <circle cx="17" cy="70" r="4.5" fill="#000"/>
    <circle cx="17" cy="113" r="4.5" fill="#000"/>
    <circle cx="83" cy="27" r="4.5" fill="#000"/>
    <circle cx="83" cy="70" r="4.5" fill="#000"/>
    <circle cx="83" cy="113" r="4.5" fill="#000"/>
    <polygon points="42,53 42,87 70,70" fill="#000"/>
  </mask>
  <symbol id="mark" viewBox="0 0 100 140">
    <rect x="0" y="0" width="100" height="140" fill="currentColor" mask="url(#markMask)"/>
  </symbol>
</defs>

<rect width="640" height="260" rx="10" fill="#121014"/>

<g transform="translate(178,80)" style="color:#e8402c">
  <use href="#mark" width="66" height="92"/>
</g>
<text x="266" y="145" class="serif" font-size="44" fill="#e8402c">Red<tspan fill="#f6f1e7">Blog</tspan></text>

</svg>
